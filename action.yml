name: Portal de documentação
description: Gera o portal de documentação em uma única página HTML a partir do Markdown do repositório (README.md e docs/).
inputs:
  incluir:
    description: Padrões glob extras de Markdown, um por linha (ex.: modules/*/README.md).
    required: false
    default: ""
  saida:
    description: Arquivo gerado, relativo ao repositório.
    required: false
    default: _portal/index.html
  online:
    description: "true carrega o Mermaid do CDN (página leve); false exige o mermaid.min.js local."
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"
    - name: Gerar o portal
      shell: bash
      env:
        INCLUIR: ${{ inputs.incluir }}
        SAIDA: ${{ inputs.saida }}
        ONLINE: ${{ inputs.online }}
        ACAO: ${{ github.action_path }}
      run: |
        python -m pip install --quiet "markdown==3.10.*"
        args=()
        while IFS= read -r padrao; do
          [ -n "$padrao" ] && args+=(--incluir "$padrao")
        done <<< "$INCLUIR"
        [ "$ONLINE" = "true" ] && args+=(--online)
        python "$ACAO/gerar-portal.py" --repo "$GITHUB_WORKSPACE" --saida "$SAIDA" "${args[@]}"
